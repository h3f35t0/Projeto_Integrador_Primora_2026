<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Sistema de Importação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: linear-gradient(135deg, #edf2f8, #dfe8f3); }
        .login-card { width: 100%; max-width: 420px; border: 0; border-radius: 16px; }
        .brand-icon { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 14px; background: #e8f0ff; color: #0d6efd; font-size: 26px; margin: 0 auto 16px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<main class="card login-card shadow-lg">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-icon">▦</div>
            <h1 class="h4 mb-1">Acessar o sistema</h1>
            <p class="text-muted mb-0">Entre com seu usuário e senha</p>
        </div>
        {% if form.errors %}
            <div class="alert alert-danger">Usuário ou senha inválidos. Verifique seus dados e tente novamente.</div>
        {% endif %}
        {% if next and not user.is_authenticated %}
            <div class="alert alert-info">Faça login para continuar.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
                <label for="id_username" class="form-label">Usuário</label>
                <input type="text" name="username" id="id_username" class="form-control form-control-lg"
                       placeholder="Digite seu usuário" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="id_password" class="form-label">Senha</label>
                <input type="password" name="password" id="id_password" class="form-control form-control-lg"
                       placeholder="Digite sua senha" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
        </form>
    </div>
    <div class="card-footer bg-white border-0 text-center text-muted small pb-4">Sistema de Importação</div>
</main>
</body>
</html>
